<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff9f3">
<title>Máster IA Aplicativa V2.7</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">

<style>

:root{
--ink:#171724;
--cream:#fff9f3;
--muted:#707283;
--line:#e7e5ee;
--blue:#5b6cff;
--violet:#8e5cff;
--aqua:#28d7c0;
--lime:#bdf34a;
--coral:#ff705d;
--yellow:#ffd84a;
--pink:#ff68b4;
--shadow:0 16px 44px rgba(43,35,78,.10);
--scale:1
}

*{
box-sizing:border-box
}

html{
scroll-behavior:smooth;
font-size:calc(16px * var(--scale))
}

body{
margin:0;
background:
linear-gradient(
180deg,
#fffaf5 0%,
#f7f5ff 55%,
#f7f9ff 100%
);
color:var(--ink);
font-family:
Manrope,
system-ui,
-apple-system,
sans-serif
}

.app{
max-width:980px;
margin:auto;
padding-bottom:112px
}

.top{
position:sticky;
top:0;
z-index:30;
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:12px 16px;
background:rgba(255,249,243,.9);
backdrop-filter:blur(16px);
border-bottom:1px solid rgba(231,229,238,.7)
}

.brand{
display:flex;
align-items:center;
gap:10px;
min-width:0
}

.logo{
width:42px;
height:42px;
border-radius:14px;
background:
linear-gradient(
135deg,
var(--blue),
var(--pink)
);
color:#fff;
display:grid;
place-items:center;
font-size:23px;
box-shadow:
0 10px 28px rgba(91,108,255,.25);
flex:0 0 auto
}

.brand-title{
font-family:"Plus Jakarta Sans";
font-weight:800;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.brand-sub{
font-size:12px;
font-weight:700;
color:#7c7e8d
}

.top-actions{
display:flex;
gap:8px;
align-items:center
}

.icon-btn{
width:40px;
height:40px;
border-radius:13px;
border:1px solid var(--line);
background:#fff;
display:grid;
place-items:center;
cursor:pointer;
font-size:20px
}

.save{
opacity:0;
pointer-events:none;
font-size:12px;
font-weight:800;
padding:7px 10px;
border-radius:999px;
background:#fff;
border:1px solid var(--line);
transition:.2s
}

.save.show{
opacity:1
}

main{
padding:0 16px
}

.screen{
display:none;
animation:enter .24s ease
}

.screen.active{
display:block
}

@keyframes enter{
from{
opacity:0;
transform:translateY(8px)
}
to{
opacity:1;
transform:none
}
}

.hero{
padding:24px 0 14px
}

.eyebrow{
font-size:12px;
font-weight:800;
text-transform:uppercase;
letter-spacing:.12em;
color:var(--violet)
}

h1,
h2,
h3{
font-family:"Plus Jakarta Sans",Manrope,sans-serif;
letter-spacing:-.035em
}

h1{
font-size:clamp(36px,7.5vw,56px);
line-height:1.01;
margin:8px 0 12px
}

h2{
font-size:clamp(25px,5vw,34px);
line-height:1.06;
margin:6px 0 10px
}

h3{
font-size:20px;
margin:4px 0 8px
}

p{
color:var(--muted);
line-height:1.55;
margin:8px 0
}

.grid{
display:grid;
gap:16px
}

.two{
grid-template-columns:
repeat(
2,
minmax(0,1fr)
)
}

.card{
background:#fff;
border:1px solid var(--line);
border-radius:24px;
padding:20px;
box-shadow:var(--shadow)
}

.c-blue{
background:
linear-gradient(
135deg,
#6677ff,
#5263f4
);
color:#fff;
border:0
}

.c-violet{
background:
linear-gradient(
135deg,
#8e5cff,
#af6cff
);
color:#fff;
border:0
}

.c-aqua{
background:
linear-gradient(
135deg,
#20ccb5,
#65e5d3
);
color:#10231f;
border:0
}

.c-coral{
background:
linear-gradient(
135deg,
#ff705d,
#ff9988
);
color:#fff;
border:0
}

.c-yellow{
background:
linear-gradient(
135deg,
#ffd84a,
#ffe992
);
color:#3b3200;
border:0
}

.c-lime{
background:
linear-gradient(
135deg,
#bdf34a,
#e1ff94
);
color:#26310f;
border:0
}

.c-blue p,
.c-violet p,
.c-coral p{
color:rgba(255,255,255,.92)
}

.btn{
border:0;
border-radius:16px;
padding:14px 18px;
font-weight:800;
cursor:pointer;
display:inline-flex;
align-items:center;
justify-content:center;
gap:8px;
transition:.16s;
min-height:48px
}

.btn:active{
transform:scale(.985)
}

.btn[disabled]{
opacity:.42;
cursor:not-allowed
}

.primary{
background:var(--ink);
color:#fff
}

.white{
background:#fff;
color:var(--ink)
}

.soft{
background:#f1eff6;
color:var(--ink)
}

.outline{
background:transparent;
border:1px solid var(--line);
color:var(--ink)
}

.nav{
position:fixed;
left:50%;
transform:translateX(-50%);
bottom:12px;
width:min(94%,700px);
z-index:50;
display:grid;
grid-template-columns:
repeat(
4,
1fr
);
gap:4px;
background:rgba(255,255,255,.92);
backdrop-filter:blur(14px);
border:1px solid var(--line);
border-radius:24px;
padding:7px;
box-shadow:
0 18px 55px rgba(31,28,60,.14)
}

.nav button{
border:0;
background:transparent;
color:#7c7e8d;
border-radius:18px;
padding:9px 3px;
font-weight:700;
font-size:12px;
cursor:pointer
}

.nav button.active{
background:var(--ink);
color:#fff
}

.nav i{
display:block;
font-size:22px;
margin-bottom:4px
}

.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px
}

.progress{
height:10px;
border-radius:999px;
background:rgba(23,23,36,.09);
overflow:hidden
}

.progress span{
display:block;
height:100%;
background:
linear-gradient(
90deg,
var(--blue),
var(--pink)
);
transition:.35s
}

.chips{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:10px
}

.chip,
.status-pill{
padding:7px 10px;
border-radius:999px;
background:#f1eff6;
font-size:12px;
font-weight:800
}

/* SESSION LAUNCHER */

.session-modes{
display:grid;
grid-template-columns:
repeat(
3,
1fr
);
gap:10px
}

.session-mode{
border:1px solid var(--line);
background:#fff;
border-radius:18px;
padding:14px 10px;
text-align:center;
cursor:pointer
}

.session-mode.active{
background:var(--ink);
color:#fff
}

.session-mode strong{
display:block;
font-size:18px
}

.session-plan{
display:grid;
gap:10px;
margin-top:12px
}

.plan-item{
display:grid;
grid-template-columns:36px 1fr auto;
align-items:center;
gap:10px;
background:#fff;
border-radius:16px;
padding:11px 12px;
border:1px solid var(--line)
}

.plan-icon{
width:36px;
height:36px;
border-radius:12px;
background:#f0efff;
display:grid;
place-items:center;
color:var(--violet)
}

/* COURSES */

.stage{
margin:8px 0 26px
}

.stage-head{
display:flex;
align-items:end;
justify-content:space-between;
gap:10px;
margin:0 0 10px
}

.stage-title{
font-family:"Plus Jakarta Sans";
font-size:22px;
font-weight:800
}

.stage-sub{
font-size:13px;
color:var(--muted)
}

.route{
position:relative;
padding-left:24px
}

.route:before{
content:"";
position:absolute;
left:10px;
top:14px;
bottom:14px;
width:3px;
border-radius:999px;
background:
linear-gradient(
180deg,
var(--blue),
var(--violet),
var(--aqua),
var(--coral),
var(--yellow)
)
}

.module{
cursor:pointer;
position:relative;
overflow:visible
}

.module:before{
content:"";
position:absolute;
left:0;
top:0;
bottom:0;
width:8px;
border-radius:24px 0 0 24px;
background:var(--accent,var(--blue))
}

.route-dot{
position:absolute;
left:-20px;
top:28px;
width:22px;
height:22px;
border-radius:50%;
background:#fff;
border:5px solid var(--accent,var(--blue));
z-index:2
}

.iconbox{
width:54px;
height:54px;
border-radius:18px;
background:#f2f1f7;
display:grid;
place-items:center;
font-size:28px;
color:var(--accent,var(--blue))
}

.searchbar{
display:grid;
grid-template-columns:auto 1fr;
gap:8px;
align-items:center;
background:#fff;
border:1px solid var(--line);
border-radius:16px;
padding:0 12px;
margin:8px 0 18px
}

.searchbar input{
border:0;
outline:0;
background:transparent;
padding:14px 0;
font:inherit
}

.lesson-row{
display:grid;
grid-template-columns:42px 1fr auto;
gap:10px;
align-items:center;
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:14px;
margin:10px 0;
cursor:pointer
}

.dot{
width:36px;
height:36px;
border-radius:12px;
background:#f0eff6;
display:grid;
place-items:center;
font-weight:800
}

.dot.done{
background:#dcf9a7;
color:#27310f
}

.back{
display:inline-flex;
align-items:center;
gap:6px;
font-weight:800;
color:#5f6274;
cursor:pointer;
margin:8px 0 12px
}

/* LESSON */

.step{
max-width:760px;
margin:auto
}

.step-card{
min-height:400px;
display:flex;
flex-direction:column;
justify-content:space-between;
overflow:hidden;
position:relative
}

.step-card:after{
content:"";
position:absolute;
width:220px;
height:220px;
border-radius:44% 56% 61% 39%;
right:-100px;
top:-90px;
background:rgba(255,255,255,.22);
transform:rotate(25deg)
}

.step-main{
position:relative;
z-index:2
}

.step-main h1{
font-size:clamp(34px,7vw,48px);
overflow-wrap:anywhere
}

.step-icon{
width:64px;
height:64px;
border-radius:20px;
background:rgba(255,255,255,.82);
display:grid;
place-items:center;
font-size:30px;
margin:18px 0
}

.options{
display:grid;
gap:10px;
margin-top:18px
}

.option{
border:1px solid rgba(23,23,36,.12);
background:#fff;
border-radius:18px;
padding:15px;
text-align:left;
font-weight:800;
cursor:pointer
}

.option.correct{
border-color:#78d06c;
background:#efffe6;
animation:pop .2s ease
}

.option.wrong{
border-color:#ff9183;
background:#fff0ed;
animation:shake .2s ease
}

@keyframes pop{
50%{
transform:scale(1.02)
}
}

@keyframes shake{
25%{
transform:translateX(-4px)
}
75%{
transform:translateX(4px)
}
}

.feedback{
margin-top:14px;
padding:14px 16px;
border-radius:16px;
background:rgba(255,255,255,.78);
font-weight:700;
line-height:1.45
}

.confidence{
margin-top:14px
}

.confidence-title{
font-size:13px;
font-weight:800;
margin-bottom:8px
}

.confidence-buttons{
display:flex;
gap:8px;
flex-wrap:wrap
}

.confidence-buttons button{
border:1px solid rgba(23,23,36,.12);
background:#fff;
border-radius:999px;
padding:9px 12px;
font-weight:800;
cursor:pointer
}

.confidence-buttons button.sel{
background:var(--ink);
color:#fff
}

.process{
display:flex;
gap:8px;
flex-wrap:wrap;
align-items:center;
margin-top:18px
}

.process span{
background:rgba(255,255,255,.9);
padding:10px 13px;
border-radius:14px;
font-weight:800;
color:var(--ink)
}

.compare{
display:grid;
grid-template-columns:
1fr 1fr;
gap:12px;
margin-top:18px
}

.compare>div{
background:rgba(255,255,255,.88);
border-radius:18px;
padding:16px;
color:var(--ink)
}

.choice-chip{
display:inline-flex;
margin:5px;
padding:9px 12px;
border:1px solid rgba(23,23,36,.12);
background:#fff;
border-radius:999px;
font-weight:800;
cursor:pointer
}

.choice-chip.sel{
background:var(--ink);
color:#fff
}

.lesson-progress{
display:flex;
gap:6px;
margin:8px 0 18px
}

.lesson-progress span{
height:6px;
flex:1;
background:#e6e5ed;
border-radius:999px
}

.lesson-progress .done{
background:var(--aqua)
}

.lesson-progress .active{
background:var(--violet)
}

.why{
margin:12px 0;
background:#fff7cc;
border-radius:16px;
padding:13px 14px;
color:#3d3200
}

/* PROFE */

.quick{
display:flex;
gap:8px;
flex-wrap:wrap
}

.quick button{
border:0;
background:#f1efff;
color:#6347c7;
border-radius:999px;
padding:10px 12px;
font-weight:800;
cursor:pointer
}

.chat{
display:flex;
flex-direction:column;
gap:10px;
min-height:200px;
margin-top:18px
}

.bubble{
max-width:86%;
padding:13px 15px;
border-radius:18px;
line-height:1.5
}

.assistant{
background:#f1efff;
color:#372866
}

.user{
align-self:flex-end;
background:var(--ink);
color:#fff
}

.chatbar{
position:sticky;
bottom:98px;
display:grid;
grid-template-columns:auto 1fr auto;
gap:8px;
background:rgba(255,249,243,.92);
padding:12px 0
}

.chatbar input{
border:1px solid var(--line);
border-radius:16px;
padding:14px;
min-width:0
}

/* PROGRESS */

.metric-grid{
display:grid;
grid-template-columns:
repeat(
2,
minmax(0,1fr)
);
gap:12px
}

.metric{
border-radius:20px;
padding:18px;
border:1px solid var(--line);
background:#fff
}

.metric .label{
font-size:12px;
font-weight:800;
text-transform:uppercase;
letter-spacing:.1em;
color:#77798a
}

.metric .value{
font-family:"Plus Jakarta Sans";
font-size:30px;
font-weight:800;
margin-top:4px
}

.skill-map{
display:flex;
align-items:center;
gap:8px;
flex-wrap:wrap
}

.skill-node{
padding:10px 12px;
border-radius:14px;
background:#f1eff6;
font-weight:800
}

.skill-node.on{
background:#e6ffd0
}

.portfolio-grid{
display:grid;
gap:10px
}

.portfolio-item{
display:flex;
justify-content:space-between;
align-items:center;
gap:12px;
padding:14px;
border:1px solid var(--line);
border-radius:16px;
background:#fff
}

/* MODALS */

.overlay{
position:fixed;
inset:0;
background:rgba(23,23,36,.48);
backdrop-filter:blur(8px);
z-index:100;
display:none;
align-items:center;
justify-content:center;
padding:18px;
overflow:auto
}

.overlay.show{
display:flex
}

.modal{
width:min(100%,560px);
max-height:94vh;
overflow:auto;
background:#fff;
border-radius:28px;
padding:22px;
box-shadow:
0 28px 80px rgba(23,23,36,.25)
}

.form-grid{
display:grid;
gap:13px
}

.field label{
display:block;
font-size:13px;
font-weight:800;
margin-bottom:6px
}

.field input,
.field select{
width:100%;
border:1px solid var(--line);
border-radius:16px;
padding:14px;
font:inherit;
background:#fff;
color:var(--ink)
}

.field small{
display:block;
color:#858797;
margin-top:5px;
line-height:1.4
}

.privacy{
font-size:13px;
color:#6d7080;
background:#f7f5fb;
border-radius:16px;
padding:12px;
line-height:1.5;
margin-top:14px
}

.modal-actions{
display:flex;
gap:10px;
justify-content:flex-end;
margin-top:16px
}

.toast{
position:fixed;
top:76px;
left:50%;
transform:
translateX(-50%)
translateY(-8px);
background:var(--ink);
color:#fff;
padding:11px 14px;
border-radius:14px;
opacity:0;
transition:.2s;
z-index:120;
font-weight:700
}

.toast.show{
opacity:1;
transform:
translateX(-50%)
translateY(0)
}

body.high-contrast{
--ink:#000;
--muted:#404040;
--line:#b8b8b8
}

body.reduce-motion *{
animation:none!important;
transition:none!important;
scroll-behavior:auto!important
}

@media(max-width:760px){

.two,
.compare,
.metric-grid{
grid-template-columns:1fr
}

.session-modes{
grid-template-columns:
1fr 1fr 1fr
}

.step-card{
min-height:380px
}

.process{
display:grid;
grid-template-columns:1fr;
gap:8px
}

.process span{
width:100%;
text-align:center
}

.process span:nth-child(even){
background:transparent;
padding:0;
font-size:0
}

.process span:nth-child(even)::after{
content:"↓";
font-size:20px;
opacity:.65;
color:#fff
}

main{
padding:0 14px
}

.top{
padding:10px 12px
}

.brand-sub{
display:none
}

.save{
display:none
}

.route{
padding-left:20px
}

.route:before{
left:8px
}

.route-dot{
left:-17px
}

.step-main h1{
font-size:clamp(32px,9vw,44px)
}

}
</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="brand">

<div class="logo">
<i class="ti ti-sparkles"></i>
</div>

<div>

<div class="brand-title">
Máster IA Aplicativa
</div>

<div class="brand-sub">
V2.7 · Adaptive Learning
</div>

</div>

</div>

<div class="top-actions">

<div
class="save"
id="saveBadge">
✓ Guardado
</div>

<button
class="icon-btn"
onclick="openSettings()"
aria-label="Ajustes">

<i class="ti ti-adjustments"></i>

</button>

<button
class="icon-btn"
onclick="openProfile(true)"
aria-label="Perfil">

<i class="ti ti-user"></i>

</button>

</div>

</header>

<main>

<section id="home" class="screen active"></section>

<section id="courses" class="screen"></section>

<section id="profe" class="screen"></section>

<section id="progress" class="screen"></section>

<section id="module" class="screen"></section>

<section id="lesson" class="screen"></section>

<section id="sessionEnd" class="screen"></section>

</main>

</div>

<nav class="nav">

<button
data-nav="home"
class="active">

<i class="ti ti-home"></i>
Home

</button>

<button data-nav="courses">

<i class="ti ti-books"></i>
Cursos

</button>

<button data-nav="profe">

<i class="ti ti-sparkles"></i>
Profe!

</button>

<button data-nav="progress">

<i class="ti ti-chart-line"></i>
Progreso

</button>

</nav>

<div id="toast" class="toast"></div>

<!-- PERFIL -->

<div id="profileOverlay" class="overlay">

<div class="modal">

<div class="eyebrow">
Tu perfil
</div>

<h2 id="profileTitle">
Personalicemos tu experiencia
</h2>

<div class="form-grid">

<div class="field">

<label>
Nombre *
</label>

<input
id="pfName"
maxlength="40">

</div>

<div class="field">

<label>
Edad
</label>

<input
id="pfAge"
type="number"
min="1"
max="120">

</div>

<div class="field">

<label>
Ciudad
</label>

<input
id="pfCity"
maxlength="60">

</div>

<div class="field">

<label>
Email / Gmail
</label>

<input
id="pfEmail"
type="email"
maxlength="100">

</div>

<div class="field">

<label>
Nivel con IA
</label>

<select id="pfLevel">

<option>
Principiante
</option>

<option>
Intermedio
</option>

<option>
Avanzado
</option>

</select>

</div>

<div class="field">

<label>
Objetivo principal
</label>

<select id="pfGoalType">

<option>
Aprender IA
</option>

<option>
Automatización
</option>

<option>
Crear apps
</option>

<option>
Trabajo
</option>

<option>
Otro
</option>

</select>

</div>

<div class="field">

<label>
Objetivo semanal

module.title,

module.stage

);

}

0;

function todayKey(
date=new Date()
){

return [

date.getFullYear(),

String(
date.getMonth()+1
).padStart(
2,
"0"
),

String(
date.getDate()
).padStart(
2,
"0"
)

].join(
"-"
);

}

const today=
todayKey();

if(
!S.studyDays.includes(
today
)
){

S.studyDays.push(
today

}

}

function dueReviews(){

const now=
Date.now();

return S.reviewSchedule.filter(
review=>
review.due<=now
&&
!review.done
);

}

concept,
days=2,
kind="recall"

const due=
Date.now()
+
days*
86400000;

S.reviewSchedule.push({

id:
concept
+
"_"
+
Date.now()
+
"_"
+
Math.random()
.toString(36)
.slice(
2,
6
),

concept,

due,

kind,

done:false

});

}

[

21

}

0;

let confidence=0;

let count=0;

for(
const [
key,
value
]
of
Object.entries(
S.confidence
)
){

const lesson=
allLessons().find(
item=>
key.startsWith(
item.id+"_"
)
);

if(
!lesson
){
continue;
}

const index=
Number(
key.split(
"_"
).pop()
);

const step=
lesson.steps[
index
];

if(
(
step.skill
||
step.title
)
===
skill
){

confidence+=
(
{
"Adiviné":1,
"Dudaba":2,
"Seguro":3
}[value]
||
0
);

count++;

if(
step.opts
&&
S.answers[key]===step.a
){

correct++;

}

}

}

const raw=

correct*22

+

(
count
?
confidence/count*12
:
0
)

-

wrong*12;

return Math.max(
0,
Math.min(
100,
Math.round(
raw
)
)
);

}

function quick(
mode
){

const lesson=
CL();

const step=
lesson.steps[
S.step
];

const concept=
step.skill
||
step.title;

const responses={

soc:
"Antes de responder: ¿qué diferencia clave ves entre las opciones de esta pantalla?",

hint:
`Pista: céntrate en "${step.body||step.title}" y elimina lo que no cambia la decisión.`,

example:
"Ejemplo paralelo: imagina un pedido 3D. ¿Qué parte sigue una regla fija y qué parte necesita decidir?",

why:
S.misconceptions[
concept
]
?
`Tu error parece venir de esto: ${S.misconceptions[concept]}. Compáralo con la definición central.`
:
"Aún no tengo un patrón de error suficiente. Resuelve un caso y podré explicarlo mejor."

};

const labels={

soc:"Hazme pensar",

hint:"Dame una pista",

example:"Ejemplo paralelo",

why:"¿Por qué me equivoqué?"

};

S.chat.push(

{
role:"user",
text:
labels[
mode
]
},

{
role:"assistant",
text:
responses[
mode
]
}

);

save();

renderProfe();

}

function send(){

const input=
$("#chatInput");

const text=
input.value.trim();

if(
!text
){
return;
}

S.chat.push(

{
role:"user",
text:text
},

{
role:"assistant",
text:
"Para ayudarte sin darte la respuesta demasiado pronto: identifica primero el objetivo, las reglas y la decisión principal del caso."
}

);

save();

renderProfe();

}

function escapeHtml(
text
){

return String(
text
).replace(

/[&<>"']/g,

character=>(
{
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
}
)[character]

);

}
